name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel or replace queued main runs: every release commit must be built.
jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          test "$(uname -m)" = arm64
      - name: Validate version and release policy
        id: version
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == main ]]; then
            python3 scripts/check-version.py --base-ref "$PR_BASE_SHA" --require-bump --release-policy
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 scripts/check-version.py --base-ref HEAD^ --require-bump --release-policy
          else
            python3 scripts/check-version.py
          fi
      - name: Validate scripts and release safeguards
        run: |
          git diff --check
          python3 -m compileall -q scripts
          bash -n scripts/package.sh scripts/publish-release.sh
          python3 -m unittest discover -s Tests/ReleaseTests -p 'test_*.py'
      - name: Core tests
        run: swift test --scratch-path .build-current --disable-sandbox
      - name: Build and package (ad hoc, not notarized)
        env:
          KEYLANE_ALLOW_ADHOC: '1'
        run: bash scripts/package.sh
      - name: Verify distributable and generate checksum
        run: |
          python3 scripts/verify-package.py dist/Keylane-*.zip
          cd dist
          for archive in Keylane-*.zip; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Keylane-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Keylane-${{ needs.checks.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
