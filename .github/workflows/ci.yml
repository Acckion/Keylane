name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale PR runs only; preserve each branch push validation.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_required: ${{ steps.installer.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          test "$(uname -m)" = arm64
      - name: Validate version and branch policy
        id: version
        run: python3 scripts/check-version.py --sync-policy
      - name: Validate scripts and release safeguards
        run: |
          git diff --check
          python3 -m compileall -q scripts
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s Tests/ReleaseTests -p 'test_*.py'
      - name: Verify Swift Build output and Focus metadata
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_build_inputs="$(git diff --name-only "$BASE_SHA" HEAD -- Package.swift Package.resolved scripts/build-release-executable.sh scripts/app_intents.py .github/workflows/ci.yml)"
          if [[ -n "$changed_build_inputs" ]]; then
            xcodebuild -version
            executable="$(bash scripts/build-release-executable.sh)"
            printf 'Verified Keylane executable: %s\n' "$executable"
            python3 - "$executable" <<'PY'
          import pathlib
          import sys
          import tempfile

          sys.path.insert(0, 'scripts')
          from app_intents import extract_metadata, object_directories

          binary = pathlib.Path(sys.argv[1]).resolve(strict=True)
          output = binary.parents[2]
          try:
              with tempfile.TemporaryDirectory(prefix='keylane-check-intents-') as resources:
                  extract_metadata(binary, resources, pathlib.Path.cwd())
          except (ValueError, OSError):
              for directory in object_directories(binary):
                  print(f'Expected constant values directory: {directory.relative_to(output)}', flush=True)
              matches = sorted(p.relative_to(output) for p in output.rglob('*.swiftconstvalues') if p.is_file())
              print(f'Found {len(matches)} Swift constant-value files under {output.name}:', flush=True)
              for path in matches[:40]:
                  print(path, flush=True)
              raise
          PY
          fi
      - name: Determine whether to validate the installer
        if: github.event_name == 'push'
        id: installer
        run: python3 scripts/check-installer-scope.py
      - name: Core tests
        run: swift test --scratch-path .build-current --disable-sandbox
      - name: AI native file tools and approval integration
        run: bash scripts/verify-ai-file-tools.sh
      - name: File search controller integration
        run: bash scripts/verify-files.sh
      - name: File index restart recovery integration
        run: KEYLANE_FILE_TEST_SOURCE=Tests/Integration/file-restart-main.swift bash scripts/verify-files.sh
      - name: Deferred file content integration
        run: KEYLANE_FILE_TEST_SOURCE=Tests/Integration/file-content-main.swift bash scripts/verify-files.sh

  sign-preview-auto:
    name: Sign integrated preview ${{ github.sha }}
    if: >-
      needs.checks.outputs.installer_required == 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30
    environment: preview-signing-auto
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify integrated preview target
        run: python3 scripts/check-preview-target.py
      - name: Import Apple Development signing identity
        env:
          CERTIFICATE: ${{ secrets.KEYLANE_PREVIEW_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.KEYLANE_PREVIEW_P12_PASSWORD }}
        run: bash scripts/import-release-certificate.sh --preview
      - name: Build and verify signed DMG
        run: |
          bash scripts/package.sh
          python3 scripts/verify-package.py dist/Keylane-*.dmg
          echo 'Apple Development signed preview DMG; without Apple notarization' >> "$GITHUB_STEP_SUMMARY"
          cd dist
          for image in Keylane-*.dmg; do
            shasum -a 256 "$image" > "$image.sha256"
          done
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/keylane-signing.keychain-db" 2>/dev/null || true
      - name: Upload verified preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Keylane-${{ needs.checks.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
